<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Pixel Heart — Firna ❤️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .qr-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 28px 18px 40px;
      position: relative;
      z-index: 1;
      overflow-y: auto;
      color: var(--ink);
      background: linear-gradient(160deg, var(--pink-50), var(--pink-100));
    }
    .qr-page h1 {
      font-family: var(--font-script);
      font-weight: 400;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      color: var(--rose);
      text-align: center;
    }
    .qr-page .sub {
      color: var(--ink-soft);
      font-weight: 600;
      text-align: center;
      max-width: 460px;
      font-size: 0.95rem;
    }
    .qr-panel {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--pink-200);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lift);
      padding: 20px;
      width: min(100%, 520px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #qr-canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      background: #fff;
    }
    .qr-label {
      font-weight: 700;
      color: var(--ink);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }
    .qr-url-row { display: flex; gap: 8px; flex-wrap: wrap; }
    #qr-url {
      flex: 1 1 220px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.8em 1em;
      border-radius: 14px;
      border: 2px solid var(--pink-200);
      background: var(--pink-50);
      color: var(--ink);
      outline: none;
    }
    #qr-url:focus { border-color: var(--pink-400); background: #fff; }
    .swatches { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px var(--pink-200), 0 4px 10px rgba(214, 51, 108, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease;
      padding: 0;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.on { box-shadow: 0 0 0 3px var(--rose), 0 4px 12px rgba(214, 51, 108, 0.4); transform: scale(1.1); }
    #qr-custom {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      padding: 0;
    }
    .qr-tip {
      font-size: 0.8rem;
      color: var(--ink-soft);
      line-height: 1.55;
      background: var(--pink-50);
      border: 1.5px dashed var(--pink-200);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .qr-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="qr-page">
    <h1>QR Code 💗</h1>
    <p class="sub">QR kotak sederhana berwarna pink — masukkan URL website, lalu unduh PNG-nya.</p>

    <div class="qr-panel">
      <canvas id="qr-canvas" aria-label="Preview QR code pixel heart"></canvas>

      <div>
        <p class="qr-label">🔗 URL Website</p>
        <div class="qr-url-row" style="margin-top:8px">
          <input id="qr-url" type="text" spellcheck="false" placeholder="https://username.github.io/firna-birthday/">
        </div>
      </div>

      <div>
        <p class="qr-label">🎨 Warna Heart</p>
        <div class="swatches" style="margin-top:8px" id="swatches">
          <button class="swatch on" data-color="#B20A4F" style="background:#B20A4F" title="Rose Pink"></button>
          <button class="swatch" data-color="#E83E8C" style="background:#E83E8C" title="Hot Pink"></button>
          <button class="swatch" data-color="#C2185B" style="background:#C2185B" title="Berry Pink"></button>
          <button class="swatch" data-color="#D32F2F" style="background:#D32F2F" title="Merah"></button>
          <input id="qr-custom" type="color" value="#B20A4F" title="Warna custom">
        </div>
      </div>

      <p class="qr-tip">
        💡 QR menggunakan bentuk kotak standar dan area kosong di sekelilingnya. Untuk hasil terbaik, pilih warna <b>Berry Pink</b> atau <b>Merah</b>, lalu tes scan sebelum dicetak.
      </p>

      <div class="qr-actions">
        <button class="btn btn-primary" id="btn-download">Download PNG ⬇️</button>
        <a class="btn btn-soft" href="index.html" style="text-decoration:none">Lihat Website ❤️</a>
      </div>
    </div>
  </main>

  <script src="js/qrcode.min.js"></script>
  <script>
    "use strict";

    const DEFAULT_URL = "https://pinbhannn.github.io/firna-birthday/";
    const canvas = document.getElementById("qr-canvas");
    const ctx = canvas.getContext("2d");
    const urlInput = document.getElementById("qr-url");
    const customInput = document.getElementById("qr-custom");
    let currentColor = "#B20A4F";

    urlInput.value = DEFAULT_URL;

    function buildQR(url) {
      const qr = qrcode(0, "H");
      qr.addData(url);
      qr.make();
      return qr;
    }

    function render() {
      const url = urlInput.value.trim() || DEFAULT_URL;
      let qr;
      try {
        qr = buildQR(url);
      } catch (e) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#5c3a48";
        ctx.font = "600 14px Quicksand, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("URL terlalu panjang untuk QR ini 😢", canvas.width / 2, 40);
        return;
      }

      const S = 2;
      const N = qr.getModuleCount();
      const QUIET = 4;
      const W = 760;
      const H = 760;
      const moduleSize = Math.min(14, (W - 160) / (N + QUIET * 2));
      const qrSize = (N + QUIET * 2) * moduleSize;
      const qx = (W - qrSize) / 2;
      const qy = (H - qrSize) / 2;
      const card = 22;

      canvas.width = W * S;
      canvas.height = H * S;
      canvas.style.aspectRatio = "1 / 1";
      ctx.setTransform(S, 0, 0, S, 0, 0);

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, "#fff7fa");
      bg.addColorStop(1, "#ffe7ef");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#ffffff";
      roundRect(ctx, card, card, W - card * 2, H - card * 2, 30);
      ctx.fill();
      ctx.strokeStyle = "#ffd0e0";
      ctx.lineWidth = 2;
      roundRect(ctx, card + 1, card + 1, W - card * 2 - 2, H - card * 2 - 2, 29);
      ctx.stroke();

      ctx.fillStyle = "#d6336c";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "34px 'Great Vibes', cursive";
      ctx.fillText("Scan untuk kejutan ❤️", W / 2, 62);

      // QR kotak standar: modul pink di atas latar putih dengan quiet zone 4 modul.
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(qx, qy, qrSize, qrSize);
      for (let row = 0; row < N; row++) {
        for (let col = 0; col < N; col++) {
          if (!qr.isDark(row, col)) continue;
          ctx.fillStyle = currentColor;
          ctx.fillRect(
            qx + (col + QUIET) * moduleSize,
            qy + (row + QUIET) * moduleSize,
            moduleSize,
            moduleSize,
          );
        }
      }

      ctx.fillStyle = "#8a6272";
      ctx.font = "600 16px Quicksand, sans-serif";
      ctx.fillText("OH MY, MY LOVE", W / 2, H - 62);
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    // swatches
    document.getElementById("swatches").addEventListener("click", (e) => {
      const b = e.target.closest(".swatch");
      if (!b) return;
      currentColor = b.dataset.color;
      document.querySelectorAll(".swatch").forEach((s) => s.classList.toggle("on", s === b));
      render();
    });
    customInput.addEventListener("input", () => {
      currentColor = customInput.value;
      document.querySelectorAll(".swatch").forEach((s) => s.classList.remove("on"));
      render();
    });

    let t;
    urlInput.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(render, 300);
    });

    document.getElementById("btn-download").addEventListener("click", () => {
      const a = document.createElement("a");
      a.download = "qr-ucapan-firna.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    });

    render();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(render);
    }
  </script>
</body>
</html>
